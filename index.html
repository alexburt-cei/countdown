<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vuelvo el 14 de diciembre</title>
<meta name="description" content="Cuenta atrás hasta el 14/12/2026 a las 08:00 (hora de Madrid)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
<main>

  </div>
  <p class="msg">Vuelvo el 14 de diciembre</p>
  <p class="done" id="done" hidden>¡Ha llegado el momento!</p>
</main>
<script src="script.js"></script>
</body>
</html>
