<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuenta atrás · 14 de diciembre</title>
<meta name="description" content="Cuenta atrás hasta el 14/12/2026 a las 08:00 (hora de Madrid)">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>Cuenta atrás</h1>
  <p class="target">14 de diciembre de 2026 · 08:00 (hora de Madrid)</p>
  <div class="timer" id="timer" role="timer" aria-live="off">
    <div><span id="d">--</span><small>días</small></div>
    <div><span id="h">--</span><small>horas</small></div>
    <div><span id="m">--</span><small>minutos</small></div>
    <div><span id="s">--</span><small>segundos</small></div>
  </div>
  <p class="done" id="done" hidden>¡Ha llegado el momento!</p>
</main>
<script src="script.js"></script>
</body>
</html>
